# EqR Maze-Unique paper FPF recipe.
# Frozen reproduction recipe; see README.md for source and protocol.
data:
  dataset: maze_unique
model:
  hidden_size: 256
  cond_dim: 128
  n_blocks: 8
  n_heads: 8
  dropout: 0.1
  self_cond: true
train:
  lr: 0.0001
  weight_decay: 1.0
  ema_decay: 0.9999
  local_batch_size: 64
  warmup_steps: 500
  log_every: 100
  save_every: 5000
  val_every: 2000
  save_best_metric: val/solved
pipeline:
  seed: 0
  num_workers: 1
  stage_a_steps: 300000
  stage_b_steps: 100000
  warm_start: best
loss:
  self_cond_prob: 0.5
  self_forcing_rollout: 0.5
  sfr_t_min: 0.0
  sfr_fixed_depth: 16
  sfr_deep_sup_n: 4
validation:
  num_samples: 128
  subset_seed: 0
  batch_size: 64
  sampler: euler
  steps: 64
  self_cond: true
evaluation:
  num_samples: null
  subset_seed: 0
  batch_size: 64
  sampler: held_t
  held_level: 0.3
  held_iters: 256
  renoise: 1.0
  steps: 256
  self_cond: true
  noise_scale: 0.2
